<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f3f27">
<title>ATİK ETS · Lider Paneli</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ETS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://xudogjlcrlwumpmpzpcd.supabase.co" crossorigin>
<link rel="preload" href="fontlar/manrope-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fontlar/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="stil.css?v=10">
<script src="config.js?v=1"></script>
<script src="onay.js?v=1"></script>
<script src="ortak.js?v=1"></script>
<script src="form.js?v=1" defer></script>
<script src="pwa.js?v=4" defer></script>
</head>
<body>
<header class="bas-serit"><div class="bas-ic"><img src="logo.png" alt="ATİK"><div><small>ATİK · ETS Ekip Takip Sistemi</small><b id="ekipAd">Yükleniyor…</b></div></div><p class="bas-selam" id="selam" hidden></p></header>
<main class="sayfa">
  <div id="hata" class="kart" hidden><div class="kutu-hata" id="hataMetin"></div></div>
  <nav class="sekme-cubuk" id="sekme" style="--n:3" hidden>
    <button data-s="ana" class="secili">Raporlarım</button>
    <button data-s="akis">Akış</button>
    <button data-s="sohbet">Sohbet<i class="nokta" id="sohbetSay" hidden></i></button>
  </nav>

  <!-- ANA -->
  <section id="ana" hidden>
    <div id="kadro" class="not" hidden></div>
    <div id="pushYer"></div>
    <div class="sayilar kadro">
      <div class="sayi"><b id="sFaal">0</b><span>Bu ay faaliyet</span></div>
      <div class="sayi"><b id="sKat">0</b><span>Bu ay katılım</span></div>
      <div class="sayi"><b id="sHar">0 ₺</b><span>Bu ay harcama</span></div>
    </div>
    <button class="btn ana tam kadro" id="yeniBtn" style="min-height:58px;font-size:17px;margin-bottom:14px">＋ Yeni faaliyet raporu</button>
    <div class="kart">
      <h2>Raporlarım <small id="gunlerYazi"></small></h2>
      <div id="raporListe"></div>
    </div>
    <div class="kart kadro">
      <h2>Ekip üyelerim <small id="uyeSay"></small></h2>
      <div id="uyeListeAna" class="cipler"></div>
    </div>
  </section>

  <!-- AKIŞ -->
  <section id="akis" hidden>
    <div class="akis-bar"><span class="not" style="margin:0">Tüm ekiplerin gönderdiği faaliyet raporları</span><button class="btn kucuk" id="akisYenile" type="button">Yenile</button></div>
    <div id="akisListe"></div>
    <button class="btn tam" id="akisDaha" type="button" hidden>Daha eski raporlar</button>
  </section>

  <!-- SOHBET: kanallar (duyurular, genel, erkek/kız grubu) + özel mesajlar -->
  <section id="sohbet" hidden>
    <div class="dc" id="dc" data-g="liste">
      <aside class="dc-yan">
        <div class="dc-ara"><input id="kisiAra" type="search" placeholder="Kişi ara, özel mesaj yaz…" autocomplete="off" aria-label="Kişi ara"></div>
        <div class="kart dc-sonuc" id="kisiSonuc" hidden></div>
        <div class="kart sohbet-liste" id="kanalListe"></div>
      </aside>
      <div class="dc-ana">
        <div class="dc-ust"><button class="btn kucuk" id="dcGeri" type="button" aria-label="Geri">←</button><span class="avatar kucuk" id="dcAv"></span><div class="post-kim"><b id="dcAd"></b><small id="dcAlt"></small></div></div>
        <div class="dc-mesajlar" id="mesajlar"><div class="bos">Soldan bir kanal seçiniz.</div></div>
        <div class="mesaj-yaz" id="mesajYaz"><div><textarea id="mesajGir" rows="1" maxlength="1000" placeholder="Mesaj yazınız…"></textarea><button class="btn ana" id="mesajGonder" type="button" aria-label="Gönder">➤</button></div></div>
      </div>
    </div>
  </section>

  <!-- FORM (form.js doldurur) -->
  <section id="form" hidden></section>

  <!-- BAŞARI -->
  <section id="basari" hidden>
    <div class="kart basari"><div class="isaret">✓</div><h2 id="basariBaslik">Rapor gönderildi</h2><p style="color:var(--ink2)" id="basariYazi">Emeğinize sağlık liderim. Raporunuz yönetime iletildi.</p><button class="btn ana" id="anaDon">Ana sayfaya dön</button></div>
  </section>
</main>

<div class="bildirim" id="bildirim" hidden></div>

<script>
const $ = id => document.getElementById(id);
// Link ?k= ile gelir; ana ekran ikonu linksiz açılırsa son token'ı kullanır.
const TOKEN = (() => { let t = new URLSearchParams(location.search).get('k') || ''; try { t ? localStorage.setItem('ets-k', t) : t = localStorage.getItem('ets-k') || ''; } catch {} return t; })();
const GUN = ['', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
const AY = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
const EMOJILER = ['👍', '💚', '👏', '🤲', '🌟', '🎉'];
const HATALAR = {gecersiz_link: 'Bu bağlantı geçersiz ya da kapatılmış. Lütfen yönetimden yeni bağlantı isteyiniz.', tarih_gecersiz: 'Tarih geçersiz (en fazla 120 gün geriye girilebilir).', tutar_gecersiz: 'Harcama tutarı geçersiz.', rapor_yok: 'Rapor bulunamadı.', yorum_gecersiz: 'Yorum 1 ile 500 karakter arasında olmalıdır.', cok_hizli: 'Çok hızlı işlem yaptınız, lütfen biraz bekleyiniz.', emoji_gecersiz: 'Bu tepki kullanılamıyor.', mesaj_gecersiz: 'Mesaj 1 ile 1000 karakter arasında olmalıdır.', sohbet_yok: 'Bu sohbet artık kullanılamıyor.', yol_gecersiz: 'Dosya adı geçersiz.', medya_gecersiz: 'Çok fazla dosya eklendi.'};
let V = null, duzenlenen = null;

const tl = n => Number(n || 0).toLocaleString('tr-TR', {maximumFractionDigits: 2}) + ' ₺';
const bugun = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const genis = () => matchMedia('(min-width:1100px)').matches;

function bildir(m, hata) { const b = $('bildirim'); b.textContent = m; b.className = 'bildirim' + (hata ? ' hata' : ''); b.hidden = false; clearTimeout(b._t); b._t = setTimeout(() => b.hidden = true, hata ? Math.max(6500, String(m).length * 60) : 3200); b.onclick = () => b.hidden = true; }

async function rpc(f, body) {
  const r = await fetch(CFG.URL + '/rest/v1/rpc/' + f, {method: 'POST', headers: {apikey: CFG.ANON, Authorization: 'Bearer ' + CFG.ANON, 'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error(HATALAR[j?.message] || 'Bir sorun oluştu, lütfen tekrar deneyiniz. (' + (j?.message || r.status) + ')');
  return j;
}

const SEKMELER = ['ana', 'akis', 'sohbet'];
function goster(id) {
  for (const s of [...SEKMELER, 'form', 'basari']) $(s).hidden = s !== id;
  if (id !== 'sohbet') { clearInterval(sohbetT); KANAL = null; }
  if (id !== 'form') window.RaporFormu?.kapat();
  $('sekme').hidden = !SEKMELER.includes(id) || !V;
  for (const b of $('sekme').children) b.classList.toggle('secili', b.dataset.s === id);
  if (SEKMELER.includes(id)) $('sekme').style.setProperty('--i', SEKMELER.indexOf(id));
  scrollTo(0, 0);
}

async function yukle() {
  if (!TOKEN) return hataGoster('Bağlantı eksik. Lütfen yönetimin gönderdiği kişisel bağlantıyı kullanınız.');
  try { V = await rpc('lider_bilgi', {t: TOKEN}); } catch (e) { return hataGoster(e.message); }
  $('ekipAd').textContent = V.ekip.ad;
  kadroCiz();
  $('gunlerYazi').textContent = V.ekip.gunler.length ? '· ' + V.ekip.gunler.map(g => GUN[g]).join(', ') : '';
  anaCiz();
  sohbetSayi();
  window.pushKur?.($('pushYer'), s => rpc('lider_push_kaydet', {t: TOKEN, endpoint_: s.endpoint, p256dh_: s.p256dh, auth_: s.auth}));
  const q = new URLSearchParams(location.search), git = q.get('s');
  if (git === 'duyuru') kanalAc('duyuru'); else if (git === 'sohbet') q.get('c') ? kanalAc(q.get('c')) : sohbetAc();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sohbetSayi(); });
  setInterval(() => { if (!document.hidden) sohbetSayi(); }, 20000);
}
function hataGoster(m) { $('hata').hidden = false; $('hataMetin').textContent = m; $('ekipAd').textContent = 'ATİK ETS'; }

// Ana lider + yardımcılar: "Giriş yapan" seçimi cihazda saklanır (yardımcı yoksa hiçbir şey görünmez)
const kadroAd = () => [V.ekip.lider_ad, ...(V.ekip.yardimci || [])].filter(Boolean);
function girisAd() {
  let s = ''; try { s = localStorage.getItem('ets-giris-' + V.ekip.id) || ''; } catch {}
  return kadroAd().includes(s) ? s : V.ekip.lider_ad;
}
function kadroCiz() {
  const y = V.ekip.yardimci || [];
  $('kadro').hidden = !y.length;
  if (y.length) {
    $('kadro').innerHTML = `Lider: <b>${esc(V.ekip.lider_ad)}</b> · Yardımcı: ${esc(y.join(', '))}<br><label>Giriş yapan: <select id="girisSec">${kadroAd().map(a => `<option${a === girisAd() ? ' selected' : ''}>${esc(a)}</option>`).join('')}</select></label>`;
    $('girisSec').onchange = e => { try { localStorage.setItem('ets-giris-' + V.ekip.id, e.target.value); } catch {} kadroCiz(); };
  }
  $('selam').textContent = selam(); $('selam').hidden = false;
}

// Kurumsal hitap: saat dilimine göre selam + "liderim" (ad yoksa yalnız "liderim")
function selam() {
  const s = new Date().getHours();
  const z = s < 5 ? 'Hayırlı geceler' : s < 12 ? 'Hayırlı sabahlar' : s < 18 ? 'İyi günler' : s < 22 ? 'Hayırlı akşamlar' : 'Hayırlı geceler';
  const ilk = (girisAd() || '').trim().split(/\s+/)[0].toLocaleLowerCase('tr');
  const ad = ilk ? ilk.charAt(0).toLocaleUpperCase('tr') + ilk.slice(1) + ' ' : '';
  return `${z} ${ad}liderim, hoş geldiniz.`;
}

function anaCiz() {
  const ay = bugun().slice(0, 7), buAy = V.raporlar.filter(r => r.durum === 'gonderildi' && r.ekip_id === V.ekip.id && r.tarih.startsWith(ay));
  $('sFaal').textContent = buAy.length;
  $('sKat').textContent = buAy.reduce((a, r) => a + r.katilim, 0);
  $('sHar').textContent = tl(buAy.reduce((a, r) => a + Number(r.toplam), 0));
  $('raporListe').innerHTML = V.raporlar.length ? V.raporlar.map(r => {
    const [y, m, d] = r.tarih.split('-'), foto = r.medya.filter(x => x.t === 'foto').length, vid = r.medya.filter(x => x.t === 'video').length;
    const yok = r.durum === 'yapilmadi';
    return `<div class="liste-oge" data-id="${r.id}"><div class="tarih"><b>${+d}</b><small>${AY[m - 1]}</small></div>
      <div class="govde"><b>${yok ? 'Faaliyet yapılmadı' : esc(r.tur || 'Faaliyet') + (r.yer ? ' · ' + esc(r.yer) : '')}</b><span>${yok ? esc(r.ozet) : `${r.katilim} kişi · ${tl(r.toplam)}${foto ? ' · 📷 ' + foto : ''}${vid ? ' · 🎬 ' + vid : ''}`}</span></div>
      ${r.durum === 'taslak' ? '<span class="rozet taslak">Taslak</span>' : yok ? '<span class="rozet gri">Yok</span>' : '<span class="rozet">✓</span>'}</div>`;
  }).join('') : `<div class="bos">Henüz rapor bulunmuyor. İlk faaliyet raporunuzu ekleyebilirsiniz.</div>`;
  $('uyeSay').textContent = V.uyeler.length + ' kişi';
  $('uyeListeAna').innerHTML = V.uyeler.map(u => `<span class="cip">${esc(u.ad)}</span>`).join('') || '<span class="not">Ekibinizde henüz kayıtlı üye bulunmuyor.</span>';
  goster('ana');
}

$('raporListe').onclick = e => { const o = e.target.closest('.liste-oge'); if (o) formAc(V.raporlar.find(r => r.id === o.dataset.id)); };

// ---------- SEKMELER, AKIŞ ----------
$('sekme').onclick = e => {
  const s = e.target.closest('button')?.dataset.s; if (!s) return;
  if (s === 'ana') anaCiz(); else if (s === 'akis') akisAc(); else sohbetAc();
};

const trGun = t => new Date(t + 'T12:00').toLocaleDateString('tr-TR', {day: 'numeric', month: 'long', weekday: 'long'});
function once(z) {
  const dk = Math.round((Date.now() - new Date(z)) / 6e4);
  if (dk < 1) return 'az önce'; if (dk < 60) return dk + ' dk önce'; if (dk < 1440) return Math.floor(dk / 60) + ' sa önce';
  return new Date(z).toLocaleDateString('tr-TR', {day: 'numeric', month: 'short'});
}

let AKIS = [], akisBitti = false, acik = new Set(), taslakYorum = {};
const AKIS_SAYFA = 30;

async function akisAc() {
  goster('akis');
  $('akisListe').innerHTML = '<div class="iskelet"></div>'.repeat(3); $('akisDaha').hidden = true;
  try {
    AKIS = await rpc('lider_akis', {t: TOKEN, lim: AKIS_SAYFA, ofs: 0});
    akisBitti = AKIS.length < AKIS_SAYFA;
    akisCiz();
  } catch (e) { $('akisListe').innerHTML = ''; bildir(e.message, 1); }
}
$('akisYenile').onclick = akisAc;
$('akisDaha').onclick = async () => {
  $('akisDaha').disabled = true;
  try {
    const d = await rpc('lider_akis', {t: TOKEN, lim: AKIS_SAYFA, ofs: AKIS.length});
    const var_ = new Set(AKIS.map(p => p.id)); AKIS.push(...d.filter(p => !var_.has(p.id)));
    akisBitti = d.length < AKIS_SAYFA; akisCiz();
  } catch (e) { bildir(e.message, 1); }
  $('akisDaha').disabled = false;
};

function yorumHtml(y) {
  return `<div class="yorum" data-y="${y.id}"><span class="avatar kucuk">${esc(y.ekip_ad.charAt(0))}</span><div class="yorum-ic"><div><b>${esc(y.ekip_ad)}</b>${y.lider_ad ? ` <small>${esc(y.lider_ad)}</small>` : ''}<small class="zaman"> · ${once(y.olusturma)}</small></div><p>${esc(y.metin)}</p></div>${y.benim ? '<button type="button" class="yorum-sil" title="Yorumumu sil" aria-label="Yorumumu sil">×</button>' : ''}</div>`;
}
function postHtml(p) {
  const turler = p.tur ? p.tur.split(',').map(x => x.trim()).filter(Boolean) : [];
  const meta = [`👥 ${p.katilim} kişi`, p.sure_dk ? `⏱ ${p.sure_dk} dk` : '', p.foto ? `📷 ${p.foto} fotoğraf` : '', p.video ? `🎬 ${p.video} video` : ''].filter(Boolean);
  const ben = new Set(p.benim), ac = acik.has(p.id);
  return `<article class="post kart" data-id="${p.id}">
    <div class="post-ust"><span class="avatar">${esc(p.ekip_ad.charAt(0))}</span><div class="post-kim"><b>${esc(p.ekip_ad)}${p.ekip_id === V.ekip.id ? ' <span class="rozet">Ekibiniz</span>' : ''}</b><small>${p.lider_ad ? esc(p.lider_ad) + ' · ' : ''}${trGun(p.tarih)}</small></div></div>
    <div class="post-etiket">${turler.map(t => `<span class="rozet">${esc(t)}</span>`).join('')}${p.yer ? `<span class="rozet gri">📍 ${esc(p.yer)}</span>` : ''}</div>
    <p class="post-metin">${esc(p.ozet)}</p>
    <div class="post-meta">${meta.map(esc).join('<span>·</span>')}</div>
    <div class="tepkiler">${EMOJILER.map(em => `<button type="button" class="tepki${ben.has(em) ? ' benim' : ''}" data-e="${em}">${em}${p.tepki[em] ? `<b>${p.tepki[em]}</b>` : ''}</button>`).join('')}
      <button type="button" class="yorum-ac" aria-expanded="${ac}">💬 ${p.yorumlar.length ? p.yorumlar.length + ' yorum' : 'Yorum yaz'}</button></div>
    <div class="yorumlar" ${ac ? '' : 'hidden'}>
      ${p.yorumlar.map(yorumHtml).join('')}
      <div class="yorum-yaz"><input maxlength="500" placeholder="Yorumunuzu yazınız…" value="${esc(taslakYorum[p.id] || '')}"><button type="button" class="btn kucuk ana yorum-gonder">Gönder</button></div>
    </div></article>`;
}
function akisCiz() {
  $('akisListe').innerHTML = AKIS.length ? AKIS.map(postHtml).join('') : '<div class="kart bos">Henüz paylaşılmış bir rapor bulunmuyor.</div>';
  $('akisDaha').hidden = akisBitti || !AKIS.length;
}
function postYenile(id) {
  const p = AKIS.find(x => x.id === id), el = $('akisListe').querySelector(`[data-id="${id}"]`);
  if (p && el) el.outerHTML = postHtml(p);
}

$('akisListe').onclick = async e => {
  const el = e.target.closest('.post'); if (!el) return;
  const p = AKIS.find(x => x.id === el.dataset.id); if (!p) return;
  const b = e.target.closest('button'); if (!b) return;
  try {
    if (b.classList.contains('tepki')) {
      b.disabled = true;
      Object.assign(p, await rpc('lider_tepki', {t: TOKEN, rid: p.id, em: b.dataset.e}));
      postYenile(p.id);
    } else if (b.classList.contains('yorum-ac')) {
      acik.has(p.id) ? acik.delete(p.id) : acik.add(p.id); postYenile(p.id);
      if (acik.has(p.id)) $('akisListe').querySelector(`[data-id="${p.id}"] .yorum-yaz input`)?.focus();
    } else if (b.classList.contains('yorum-gonder')) {
      const inp = el.querySelector('.yorum-yaz input'), m = inp.value.trim();
      if (!m) return bildir('Lütfen yorumunuzu yazınız.', 1);
      b.disabled = true;
      p.yorumlar.push(await rpc('lider_yorum_ekle', {t: TOKEN, rid: p.id, metin_: m}));
      delete taslakYorum[p.id]; acik.add(p.id); postYenile(p.id);
    } else if (b.classList.contains('yorum-sil')) {
      if (!await onayla('Yorumunuz silinsin mi?', 'Sil')) return;
      const yid = b.closest('.yorum').dataset.y;
      await rpc('lider_yorum_sil', {t: TOKEN, yid});
      p.yorumlar = p.yorumlar.filter(y => y.id !== yid); postYenile(p.id);
    }
  } catch (er) { bildir(er.message, 1); postYenile(p.id); }
};
$('akisListe').oninput = e => { const el = e.target.closest('.post'); if (el && e.target.matches('.yorum-yaz input')) taslakYorum[el.dataset.id] = e.target.value; };
$('akisListe').onkeydown = e => { if (e.key === 'Enter' && e.target.matches('.yorum-yaz input')) e.target.closest('.yorum-yaz').querySelector('.yorum-gonder').click(); };

// ---------- SOHBET (Discord düzeni) ----------
// Kanallar: duyuru (yalnız yönetim yazar), genel (herkes), erkek/kiz (yalnız o grup + yönetim), özel mesaj dm:<ekip id> / dm:yonetim.
// Konuşma açıkken 4 sn'de bir yeni mesaj sorgulanır (ponytail: realtime yok; birkaç lider için yeterli).
let KAN = {kanallar: [], dm: []}, KISILER = null, KANAL = null, MESAJ = [], sohbetT = null, DUY = [], yeniDuy = new Set(), kanalImza = '';
const SABIT = {
  duyuru: {ad: 'Duyurular', alt: 'Yönetimden gelen duyurular', simge: '📢'},
  genel: {ad: 'Genel', alt: 'Tüm liderler ve yönetim', simge: '💬'},
  erkek: {ad: 'Erkek liderler', alt: 'Yalnız erkek ekip liderleri ve yönetim', simge: '👥'},
  kiz: {ad: 'Kız liderler', alt: 'Yalnız kız ekip liderleri ve yönetim', simge: '👥'},
};
const saat = z => new Date(z).toLocaleTimeString('tr-TR', {hour: '2-digit', minute: '2-digit'});
const norm = s => String(s || '').toLocaleLowerCase('tr');

function kanalBilgi(k) {
  if (SABIT[k]) return SABIT[k];
  const dm = KAN.dm.find(x => x.kanal === k);
  if (dm) return {ad: dm.ad, alt: dm.yonetim ? 'Yönetim ile özel yazışma' : (dm.lider_ad || 'Özel yazışma'), simge: dm.yonetim ? 'Y' : dm.ad.charAt(0)};
  if (k === 'dm:yonetim') return {ad: 'Yönetim', alt: 'Yönetim ile özel yazışma', simge: 'Y'};
  const kisi = KISILER?.find(x => 'dm:' + x.id === k);
  return kisi ? {ad: kisi.ad, alt: kisi.lider_ad || 'Özel yazışma', simge: kisi.ad.charAt(0)} : null;
}

async function sohbetSayi() {
  try { KAN = await rpc('lider_kanallar', {t: TOKEN}) || {kanallar: [], dm: []}; } catch { return; }
  const n = [...KAN.kanallar, ...KAN.dm].reduce((a, k) => a + (k.kanal === KANAL ? 0 : Number(k.okunmamis)), 0);
  $('sohbetSay').hidden = !n; $('sohbetSay').textContent = n; rozetYaz();
  kanalListeCiz();
}
// Ana ekran ikonundaki sayı: okunmamış sohbet + duyuru
const rozetYaz = () => window.rozet?.($('sohbetSay').hidden ? 0 : +$('sohbetSay').textContent || 0);

function kanalOge(k) {
  const b = kanalBilgi(k.kanal), aktif = k.kanal === KANAL, yeni = aktif ? 0 : Number(k.okunmamis);
  const alt = k.son_metin ? (k.son_gonderen && !k.kanal.startsWith('dm:') ? k.son_gonderen + ': ' : '') + duzMetin(k.son_metin) : b.alt;
  return `<div class="liste-oge sohbet-oge${aktif ? ' aktif' : ''}" data-k="${esc(k.kanal)}" role="button" tabindex="0">
    <span class="avatar${k.kanal === 'duyuru' ? ' duyuru-simge' : ''}">${esc(b.simge)}</span>
    <div class="govde"><b>${esc(b.ad)}${k.lider_ad ? ` <small class="zaman">· ${esc(k.lider_ad)}</small>` : ''}</b><span>${esc(alt)}</span></div>
    ${k.son_zaman ? `<small class="zaman">${once(k.son_zaman)}</small>` : ''}${yeni ? `<i class="nokta">${yeni}</i>` : ''}</div>`;
}
function kanalListeCiz() {
  if ($('sohbet').hidden) return;
  const imza = JSON.stringify([KAN, KANAL]); if (imza === kanalImza) return; kanalImza = imza;
  $('kanalListe').innerHTML = `<div class="dc-baslik">Kanallar</div>${KAN.kanallar.map(kanalOge).join('')}
    <div class="dc-baslik">Özel mesajlar</div>${KAN.dm.map(kanalOge).join('') || '<div class="not dc-bos">Henüz özel mesajınız yok. Yukarıdan kişi arayarak yazabilirsiniz.</div>'}`;
}
$('kanalListe').onclick = e => { const o = e.target.closest('.sohbet-oge'); if (o) kanalAc(o.dataset.k); };
$('kanalListe').onkeydown = e => { if (e.key === 'Enter' && e.target.matches('.sohbet-oge')) kanalAc(e.target.dataset.k); };

async function sohbetAc() {
  const son = KANAL;
  goster('sohbet'); kanalImza = '';
  $('dc').dataset.g = 'liste';
  if (!KAN.kanallar.length) $('kanalListe').innerHTML = '<div class="iskelet kisa"></div>'.repeat(3);
  await sohbetSayi();
  if (genis() && !$('sohbet').hidden) kanalAc(son || 'genel');
}

// Kişi arama: yazdıkça ekip ya da lider adına göre süzer (+ Yönetim). Listede yer almayan kişilerle de yazışılabilir.
$('kisiAra').oninput = async () => {
  const q = norm($('kisiAra').value.trim());
  if (!q) { $('kisiSonuc').hidden = true; return; }
  if (!KISILER) { try { KISILER = await rpc('lider_kisiler', {t: TOKEN}) || []; } catch (er) { return bildir(er.message, 1); } }
  if (norm($('kisiAra').value.trim()) !== q) return;
  const liste = [{id: 'yonetim', ad: 'Yönetim', lider_ad: 'Yönetim ekibi'}, ...KISILER].filter(k => norm(k.ad + ' ' + k.lider_ad + ' ' + (k.yardimci || []).join(' ')).includes(q)).slice(0, 8);
  $('kisiSonuc').innerHTML = liste.map(k => `<div class="liste-oge kisi-oge" data-id="${esc(k.id)}" role="button" tabindex="0"><span class="avatar kucuk">${esc(k.ad.charAt(0))}</span><div class="govde"><b>${esc(k.ad)}</b><span>${esc([k.lider_ad, k.yardimci?.length ? 'Yardımcı: ' + k.yardimci.join(', ') : ''].filter(Boolean).join(' · '))}</span></div></div>`).join('') || '<div class="not" style="padding:8px 4px">Eşleşen kişi yok.</div>';
  $('kisiSonuc').hidden = false;
};
$('kisiSonuc').onclick = e => { const o = e.target.closest('.kisi-oge'); if (!o) return; $('kisiAra').value = ''; $('kisiSonuc').hidden = true; kanalAc('dm:' + o.dataset.id); };

async function kanalAc(kanal) {
  if ($('sohbet').hidden) { goster('sohbet'); kanalImza = ''; if (!KAN.kanallar.length) await sohbetSayi(); }
  const b = kanalBilgi(kanal) || {ad: 'Sohbet', alt: '', simge: '💬'};
  clearInterval(sohbetT); KANAL = kanal; MESAJ = []; kanalImza = '';
  $('dc').dataset.g = 'kanal';
  $('dcAd').textContent = b.ad; $('dcAlt').textContent = b.alt; $('dcAv').textContent = b.simge;
  $('dcAv').classList.toggle('duyuru-simge', kanal === 'duyuru');
  $('mesajYaz').hidden = kanal === 'duyuru'; $('mesajGir').value = ''; $('mesajGir').style.height = '';
  kanalListeCiz();
  $('mesajlar').innerHTML = '<div class="iskelet kisa" style="width:60%"></div><div class="iskelet kisa" style="width:70%"></div><div class="iskelet kisa" style="width:50%"></div>';
  if (kanal === 'duyuru') return duyuruAc();
  try { MESAJ = await rpc('lider_mesajlar', {t: TOKEN, kanal_: kanal}); } catch (er) { if (KANAL === kanal) { $('mesajlar').innerHTML = `<div class="bos">${esc(er.message)}</div>`; } return; }
  if (KANAL !== kanal) return;
  mesajCiz(true); sohbetSayi();
  sohbetT = setInterval(sohbetYenile, 4000);
}
async function sohbetYenile() {
  if (document.hidden || KANAL === null || KANAL === 'duyuru') return;
  const kanal = KANAL, son = MESAJ.length ? MESAJ[MESAJ.length - 1].olusturma : null;
  try {
    const d = await rpc('lider_mesajlar', {t: TOKEN, kanal_: kanal, sonra: son});
    if (kanal !== KANAL) return;
    const var_ = new Set(MESAJ.map(m => m.id)), yeni = d.filter(m => !var_.has(m.id));
    if (yeni.length) { MESAJ.push(...yeni); mesajCiz(); }
  } catch {}
}
function mesajCiz(zorla) {
  const kutu = $('mesajlar'), altta = zorla || kutu.scrollHeight - kutu.scrollTop - kutu.clientHeight < 80;
  let gun = '', onceki = null;
  kutu.innerHTML = MESAJ.length ? MESAJ.map(m => {
    const t = new Date(m.olusturma), g = t.toLocaleDateString('tr-TR', {day: 'numeric', month: 'long'}), ayrac = g !== gun ? `<div class="gun-ayrac">${g}</div>` : '';
    const devam = !ayrac && onceki && onceki.ekip_id === m.ekip_id && t - new Date(onceki.olusturma) < 3e5;
    gun = g; onceki = m;
    return `${ayrac}<div class="dmsj${devam ? ' devam' : ''}${m.benim ? ' benim' : ''}" data-id="${m.id}">
      ${devam ? `<small class="dm-saat">${saat(m.olusturma)}</small>` : `<span class="avatar kucuk${m.yonetim ? ' yonetim' : ''}">${esc(m.yonetim ? 'Y' : m.ad.charAt(0))}</span>`}
      <div class="dm-ic">${devam ? '' : `<div class="dm-ust"><b>${esc(m.ad)}</b>${m.yonetim ? '<span class="rozet altin">Yönetim</span>' : ''}${m.lider_ad ? `<small>${esc(m.lider_ad)}</small>` : ''}<small class="zaman">${saat(m.olusturma)}</small></div>`}
        <div class="dm-metin">${bicim(m.metin)}</div></div>
      ${m.benim ? '<button type="button" class="m-sil" aria-label="Mesajı sil">×</button>' : ''}</div>`;
  }).join('') : '<div class="bos">Henüz mesaj yok. İlk mesajı siz yazabilirsiniz.</div>';
  if (altta) kutu.scrollTop = kutu.scrollHeight;
}
$('dcGeri').onclick = () => { clearInterval(sohbetT); KANAL = null; kanalImza = ''; $('dc').dataset.g = 'liste'; sohbetSayi(); };
$('mesajlar').onclick = async e => {
  const b = e.target.closest('.m-sil'); if (!b) return;
  if (!await onayla('Mesajınız silinsin mi?', 'Sil')) return;
  const id = b.closest('.dmsj').dataset.id;
  try { await rpc('lider_mesaj_sil', {t: TOKEN, mid: id}); MESAJ = MESAJ.filter(m => m.id !== id); mesajCiz(); } catch (er) { bildir(er.message, 1); }
};
async function mesajYolla() {
  const m = $('mesajGir').value.trim(); if (!m || KANAL === null || KANAL === 'duyuru') return;
  $('mesajGonder').disabled = true;
  try {
    const y = await rpc('lider_mesaj_gonder', {t: TOKEN, kanal_: KANAL, metin_: m});
    $('mesajGir').value = ''; $('mesajGir').style.height = ''; MESAJ.push(y); mesajCiz(true); sohbetSayi();
  } catch (er) { bildir(er.message, 1); }
  $('mesajGonder').disabled = false; $('mesajGir').focus();
}
$('mesajGonder').onclick = mesajYolla;
$('mesajGir').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && matchMedia('(hover:hover)').matches) { e.preventDefault(); mesajYolla(); } };
$('mesajGir').oninput = e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px'; };

// Duyurular kanalı: yalnız yönetim mesajları (başlık, biçimli metin, fotoğraf). Açılınca okundu işaretlenir; bu oturumda "Yeni" etiketi kalır.
const dFoto = y => CFG.URL + '/storage/v1/object/public/duyuru-medya/' + encodeURI(y);
async function duyuruAc() {
  try { DUY = await rpc('lider_duyurular', {t: TOKEN}); } catch (e) { return bildir(e.message, 1); }
  if (KANAL !== 'duyuru') return;
  for (const d of DUY) if (!d.okundu) yeniDuy.add(d.id);
  $('mesajlar').innerHTML = DUY.length ? DUY.map(d => `<article class="kart duyuru${yeniDuy.has(d.id) ? ' yeni' : ''}">
      <div class="post-ust"><span class="avatar duyuru-simge">📢</span><div class="post-kim"><b>${esc(d.baslik)}</b><small>Yönetim · ${new Date(d.olusturma).toLocaleDateString('tr-TR', {day: 'numeric', month: 'long', year: 'numeric'})}</small></div></div>
      <div class="post-etiket">${yeniDuy.has(d.id) ? '<span class="rozet taslak">Yeni</span>' : ''}${d.ozel ? '<span class="rozet">Ekibinize özel</span>' : ''}</div>
      ${d.metin ? `<div class="post-metin">${bicim(d.metin)}</div>` : ''}
      ${d.foto?.length ? `<div class="duyuru-foto n${d.foto.length}">${d.foto.map(y => `<a href="${dFoto(y)}" target="_blank" rel="noopener noreferrer"><img src="${dFoto(y)}" loading="lazy" decoding="async" alt="Duyuru fotoğrafı"></a>`).join('')}</div>` : ''}</article>`).join('')
    : '<div class="kart bos">Şu an yayında bir duyuru bulunmuyor.</div>';
  if (DUY.some(d => !d.okundu)) rpc('lider_duyuru_oku', {t: TOKEN}).then(() => sohbetSayi()).catch(() => {});
}

// ---------- FORM (form.js ortak formu) ----------
function formAc(r) {
  duzenlenen = r || null;
  goster('form');
  RaporFormu.ac($('form'), {
    rapor: r, uyeler: V.uyeler, ikramlar: [...new Set(V.raporlar.map(x => x.ikram).filter(Boolean))],
    varsayilanYer: V.raporlar.find(x => x.yer)?.yer ?? '',
    izin: yol => rpc('lider_yukle_izni', {t: TOKEN, yol_: yol}),
    kaydet: async d => {
      await rpc('lider_rapor_kaydet', {t: TOKEN, rid: duzenlenen?.id || null, d});
      V = await rpc('lider_bilgi', {t: TOKEN});
      if (d.durum === 'taslak') { bildir('Taslak kaydedildi'); return anaCiz(); }
      $('basariBaslik').textContent = d.durum === 'yapilmadi' ? 'Not alındı' : 'Rapor gönderildi';
      $('basariYazi').textContent = d.durum === 'yapilmadi' ? 'Bu gün için faaliyet yapılmadığı yönetime iletildi.' : 'Emeğinize sağlık liderim. Raporunuz yönetime iletildi.';
      goster('basari');
    },
    vazgec: anaCiz,
    sil: async () => { await rpc('lider_rapor_sil', {t: TOKEN, rid: duzenlenen.id}); V = await rpc('lider_bilgi', {t: TOKEN}); anaCiz(); bildir('Taslak silindi'); },
  });
}
$('yeniBtn').onclick = () => formAc(null);
$('anaDon').onclick = anaCiz;
yukle();
</script>
