<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATİK Kayıt</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<meta property="og:title" content="ATİK Spor Kulübü Kayıt">
<meta property="og:description" content="Etkinlik kaydı için formu doldurun.">
<link rel="stylesheet" href="ortak.css?v=5">
</head><body>
<div class="sayfa">
  <div class="ust"><img src="logo.png" alt=""><b>ATİK Spor Kulübü</b></div>
  <div id="kap"><p class="alt">Yükleniyor…</p></div>
</div>
<script src="config.js?v=3"></script>
<script src="ortak.js?v=4"></script>
<script>
const kap = document.getElementById('kap');
const slug = new URLSearchParams(location.search).get('e') || '';
const H = {apikey: CFG.ANON, Authorization: 'Bearer ' + CFG.ANON, 'Content-Type': 'application/json'};
const {esc} = FormUI;
let etk, ui, adim = 0, kalan = null;

const mesaj = (b, m) => { kap.innerHTML = `<div class="sonuc"><h2>${b}</h2><p class="alt">${m}</p></div>`; };
const zamanYaz = d => new Date(d).toLocaleString('tr-TR', {dateStyle: 'long', timeStyle: 'short'});

async function yukle() {
  try {
    const r = await fetch(`${CFG.URL}/rest/v1/etkinlik?slug=eq.${encodeURIComponent(slug)}&select=*`, {headers: H});
    etk = (await r.json())[0];
  } catch (e) {}
  if (!etk) return mesaj('Kayıt şu an açık değil', 'Bağlantı hatalı ya da kayıt kapanmış olabilir.');
  document.title = etk.baslik + ' · ATİK';
  const simdi = Date.now();
  if (etk.baslangic && simdi < new Date(etk.baslangic)) return mesaj(esc(etk.baslik), 'Kayıt ' + zamanYaz(etk.baslangic) + ' tarihinde açılacak.');
  if (etk.bitis && simdi > new Date(etk.bitis)) return mesaj('Kayıt sona erdi', 'Bu etkinliğin kayıt süresi doldu.');
  if (etk.kontenjan) {
    try {
      const r = await fetch(`${CFG.URL}/rest/v1/rpc/etkinlik_doluluk`, {method: 'POST', headers: H, body: JSON.stringify({p_slug: slug})});
      const n = await r.json(); if (typeof n === 'number') kalan = Math.max(0, etk.kontenjan - n);
    } catch (e) {}
    if (kalan === 0) return mesaj('Kontenjan doldu', 'Bu etkinlik için tüm kontenjan doldu. İlginiz için teşekkür ederiz.');
  }
  const kapak = FormUI.gorselGuvenli(etk.kapak);
  kap.innerHTML = `${kapak ? `<img class="kapak" src="${esc(kapak)}" alt="">` : ''}<h1>${esc(etk.baslik)}</h1>${etk.aciklama ? `<p class="alt">${esc(etk.aciklama)}</p>` : ''}
  ${kalan != null && kalan <= 20 ? `<p class="kalan">Kalan kontenjan: <b>${kalan}</b></p>` : ''}
  <form id="f" novalidate><div id="hata"></div><div id="alanlar"></div>
  <div class="hp"><input id="hp" tabindex="-1" autocomplete="off"></div>
  <div id="ilerleme" class="kvkk" style="text-align:center;margin:0 0 8px"></div>
  <div class="gezin"><button type="button" class="btn" id="geri" hidden>Geri</button><button class="btn ana" id="ileri"></button></div>
  <p class="kvkk">Bilgileriniz yalnızca bu etkinliğin kayıt işlemleri için kullanılır, üçüncü kişilerle paylaşılmaz.</p></form>`;
  ui = FormUI.ciz(etk, document.getElementById('alanlar'));
  document.getElementById('f').onsubmit = ileri;
  document.getElementById('geri').onclick = () => git(adim - 1);
  git(0);
}

function git(i) {
  adim = i; ui.goster(i);
  const son = i === ui.say - 1;
  document.getElementById('geri').hidden = i === 0;
  document.getElementById('ileri').textContent = son ? 'Kaydı Gönder' : 'İleri';
  document.getElementById('ilerleme').textContent = ui.say > 1 ? `Adım ${i + 1} / ${ui.say}` : '';
  if (i) window.scrollTo({top: 0, behavior: 'smooth'});
}

async function ileri(ev) {
  ev.preventDefault();
  document.getElementById('hata').innerHTML = '';
  if (adim < ui.say - 1) {
    const s = ui.oku(adim);
    if (!s.ok) return s.ilk.scrollIntoView({behavior: 'smooth', block: 'center'});
    return git(adim + 1);
  }
  const t = ui.oku(null);  // tüm bölümler
  if (!t.ok) {
    const b = +t.ilk.closest('.bolum').dataset.b; if (b !== adim) git(b);
    return t.ilk.scrollIntoView({behavior: 'smooth', block: 'center'});
  }
  if (document.getElementById('hp').value) return sonuc(); // bot: sessizce başarılı say
  const btn = document.getElementById('ileri'); btn.disabled = true; btn.textContent = 'Gönderiliyor…';
  const body = {etkinlik_id: etk.id, veri: t.veri, tekil: etk.tekil_alan ? (t.veri[etk.tekil_alan] || null) : null};
  try {
    const r = await fetch(`${CFG.URL}/rest/v1/kayit`, {method: 'POST', headers: {...H, Prefer: 'return=minimal'}, body: JSON.stringify(body)});
    if (r.ok) return sonuc();
    const j = await r.json().catch(() => ({}));
    if (j.code === '23505') return sonuc('Bu kişi için zaten bir kayıt var. Ek bir işlem yapmanıza gerek yok.');
    if (j.message === 'kontenjan_dolu') return mesaj('Kontenjan doldu', 'Siz doldururken kontenjan doldu. İlginiz için teşekkür ederiz.');
    if (j.message === 'sure_disi') return mesaj('Kayıt süresi dışında', 'Bu etkinliğin kayıt süresi dışındasınız.');
    throw new Error();
  } catch (e) {
    document.getElementById('hata').innerHTML = '<div class="kutu-hata">Gönderilemedi. İnternetinizi kontrol edip tekrar deneyin.</div>';
    btn.disabled = false; btn.textContent = 'Kaydı Gönder';
  }
}
function sonuc(m) {
  kap.innerHTML = `<div class="sonuc"><div class="isaret">✓</div><h2>${m ? 'Kayıt mevcut' : 'Kaydınız alındı'}</h2><p class="alt">${m || 'Teşekkür ederiz, kaydınız başarıyla oluşturuldu.'}</p></div>`;
}
yukle();
</script>
</body></html>
